name: Global News Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: global-news-refresh
  cancel-in-progress: true

jobs:
  refresh-global-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated global news file
        run: npm run generate:global-news

      - name: Validate generated global news payload
        run: npm run validate:global-news

      - name: Commit generated data when changed
        run: |
          if git diff --quiet; then
            echo "No generated global news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/data/global-news.generated.json
          git commit -m "chore: refresh global news generated data"
          git push origin HEAD:dev
