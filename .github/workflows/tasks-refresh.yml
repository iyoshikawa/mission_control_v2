name: Tasks Refresh

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'data/tasks.json'
      - 'scripts/generate-tasks.mjs'
      - 'scripts/validate-tasks.mjs'
      - '.github/workflows/tasks-refresh.yml'

concurrency:
  group: tasks-refresh
  cancel-in-progress: true

jobs:
  refresh-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate generated task dashboard data
        run: npm run generate:tasks

      - name: Validate generated task payload
        run: npm run validate:tasks

      - name: Commit generated task data when changed
        run: |
          if git diff --quiet; then
            echo "No generated task changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/data/tasks.generated.json
          git commit -m "chore: refresh generated task data"
          git pull --rebase origin dev
          git push origin HEAD:dev
